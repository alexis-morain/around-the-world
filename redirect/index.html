<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Around the World : le site a déménagé</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://aroundtheworld.morain.fr/">
<script>
  // Garde le chemin, la requête et le #pays : /one-film-per-country/film/jp/ devient /film/jp/
  var path = location.pathname.replace(/^\/one-film-per-country/, "").replace(/^\/(en\/)?film\//, function (m, en) { return en ? "/en/country/" : "/pays/"; }) || "/";
  location.replace("https://aroundtheworld.morain.fr" + path + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://aroundtheworld.morain.fr/">
</head>
<body>
<p>Le site a déménagé : <a href="https://aroundtheworld.morain.fr/">aroundtheworld.morain.fr</a>.</p>
</body>
</html>
